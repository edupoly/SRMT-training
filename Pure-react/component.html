<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <style>
        body {
            margin: 0px;
            font-family: Arial, Helvetica, sans-serif;
        }

        #d2 {
            width: 100%;
            height: 150px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid;
        }

        #d2 img {
            height: 100%;
        }

        #d2 ul {
            display: flex;
            list-style: none;
        }

        #d2 ul li {
            width: 200px
        }

        #hsd {
            width: 100%;
            height: 300px;
            padding: 20px 200px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: rgb(221, 221, 221);
        }
    </style>
</head>

<body>

    <div id="d1"></div>
    <script type="text/babel">
        function Navbar() {
            //state
            var logo = "https://img.magnific.com/free-vector/colorful-store-icon-abstract-logo-design_474888-3415.jpg?semt=ais_hybrid&w=740&q=80"
            var navitems = ['Home', 'Aboutus', 'Contactus', 'Featured', 'Services']
            //action
            //ui
            return (
                <div id='d2'>
                    <img src={logo} alt="" />
                    <ul>
                        {
                            navitems.map((item) => {
                                return <li>{item}</li>
                            })
                        }
                    </ul>
                </div>
            )
        }
        function HeroSection() {
            return (
                <div id="hsd">
                    <h1>Best Ecom APP in the world</h1>
                    <p>Lorem ipsum dolor sit, amet consectetur adipisicing elit. Consequuntur deleniti quibusdam eligendi et sunt doloribus delectus. Quasi nesciunt nobis ab reprehenderit saepe tempora quidem iure, alias quisquam delectus quos voluptate?</p>
                    <div>
                        <button>Read More</button>
                        <button>Goto Cart</button>
                    </div>
                </div>
            )
        }
        function App() {
            return (<div>
                <Navbar></Navbar>
                <HeroSection></HeroSection>
            </div>)
        }
        ReactDOM.render(<App></App>, document.getElementById("d1"))
    </script>
</body>

</html>
