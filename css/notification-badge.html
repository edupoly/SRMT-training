<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #d1 {
            width: 400px;
            height: 200px;
            background-color: red;
            margin: 100px;
            position: relative;
            border-radius: 20px;
        }

        #d2 {
            width: 80px;
            height: 80px;
            background-color: blue;
            border-radius: 50%;
            position: absolute;
            right: 0px;
            top: 0px;
            transform: translate(50%, -50%);
            border: 10px solid white;
        }
    </style>
</head>

<body>
    <div id="d1">
        <div id="d2"></div>
    </div>
</body>

</html>
