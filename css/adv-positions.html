<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #d1 {
            width: 500px;
            height: 400px;
            padding: 30px;
            background-color: lightcoral;
            position: absolute;
        }

        #d2 {
            width: 400px;
            height: 300px;
            padding: 30px;
            background-color: rgb(125, 190, 12);

        }

        #d3 {
            width: 300px;
            height: 200px;
            padding: 30px;
            background-color: rgb(12, 229, 245);
        }

        #d4 {
            width: 200px;
            height: 100px;
            padding: 30px;
            background-color: rgb(202, 12, 245);
            position: absolute;
            top: 0px;
            left: 0px;
        }
    </style>
</head>

<body>
    <div id="d1">
        <div id="d2">
            <div id="d3">
                <div id="d4"></div>
            </div>
        </div>
    </div>
</body>

</html>
