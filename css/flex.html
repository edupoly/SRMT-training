<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .abc li {
            display: inline-block;
            width: 150px;
            border: 1px solid;
            text-align: center;
        }

        .abc {
            text-align: center;
            border: 2px solid brown;
        }

        .xyz {
            border: 2px solid;
            text-align: center;
        }

        .klm {
            display: flex;
            justify-content: space-evenly;
            padding: 0px;
            flex-wrap: wrap;
            height: 300px;
            border: 2px solid;
            align-items: center;
        }

        .klm li {
            width: 200px;
            border: 2px solid;
            list-style: none;
            height: 70px;
        }
    </style>
</head>

<body>
    <h1 class="xyz">hello world</h1>
    <ul class="abc">
        <li>Home</li>
        <li>Aboutus</li>
        <li>Contactus</li>
        <li>Products</li>
        <li>Services</li>
    </ul>
    <ul class="klm">
        <li>Home</li>
        <li>Aboutus</li>
        <li>Contactus</li>
        <li>Products</li>
        <li>Services</li>
        <li>Tutorials</li>
        <li>Placements</li>
        <li>Sports</li>
    </ul>
</body>

</html>
