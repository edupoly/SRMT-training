<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <input type="text" onkeyup="abc(event)">
    <h1 id="d1"></h1>
    <script>
        function abc(e) {
            document.getElementById("d1").innerHTML = e.target.value;
        }
    </script>
</body>

</html>
